[build]
command = "npm run build"
publish = "dist"

# Root language detection: German devices go to /de/, everything else to /cs/.
# Netlify matches only the first language in Accept-Language (the device language).
# force = true is needed because dist/index.html would otherwise shadow these rules.
[[redirects]]
from = "/"
to = "/de/"
status = 302
force = true
conditions = {Language = ["de"]}

[[redirects]]
from = "/"
to = "/cs/"
status = 302
force = true

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
